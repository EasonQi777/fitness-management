# 每个 PR 与推送到 main 时运行代码检查、单元 / 交互测试和生产构建。
# 端到端测试（Playwright）需安装浏览器，待 T45 完成后再加入。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一分支有新提交时，取消尚未完成的旧运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint / format / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0 # 与 README 记录的开发环境一致
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
